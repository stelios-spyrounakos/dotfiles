set -a terminal-features 'tmux-256color:RGB'
#set -g default-terminal 'tmux-256color'
#set -as terminal-features ",*:RGB"


# Turn on mouse support
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -g buffer-limit 100
set -g history-limit 10000
set -g status-keys vi
set -g mode-keys vi
set -g set-clipboard on
set -g allow-passthrough on

# Changes the default key bindings to add the -c flag to specify the working directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Changes keybinds to be vim-like
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload the config file
bind r source-file ~/.tmux.conf

### Themes below ###
use_catppuccin_theme=0

%if $use_catppuccin_theme

# Catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"

set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
#set -g @catppuccin_status_left_separator "█"
#set -g @catppuccin_status_right_separator "█"
#set -g @catppuccin_status_left_separator ""
#set -g @catppuccin_status_right_separator ""

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100

set -g status-left ""

set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_application}"
#set -ag status-right "#{E:@catppuccin_status_host}"
#set -ag status-right "#{E:@catppuccin_status_user}"

# Extra customization for mode indicator
set -ag status-right "#[fg=#{E:@thm_blue}]█#[fg=#{E:@thm_crust},bg=#{E:@thm_blue}]⚑ #[fg=#{E:@thm_fg},bg=#{E:@thm_surface_0}] #{?client_prefix,WAIT,#{?pane_in_mode,COPY,#{?pane_synchronized,SYNC,TMUX}}}#[fg=#{E:@thm_surface_0}]█"


%else

set -g @tmux-gruvbox 'dark'

#set -g @tmux-gruvbox-statusbar-alpha 'true'
#set -g @tmux-gruvbox-left-status-a 'T'
set -g @tmux-gruvbox-right-status-x '#S'
set -g @tmux-gruvbox-right-status-y '#{pane_current_command}'
# Extra customization for mode indicator
set -g @tmux-gruvbox-right-status-z "#{?client_prefix,WAIT ,#{?pane_in_mode,COPY ,#{?pane_synchronized,SYNC ,TMUX }}}"

run ~/.config/tmux/plugins/gruvbox/tmux-gruvbox/gruvbox-tpm.tmux

set -g status-left ""

%endif
